      validation. Both Anthropic reviewers missed this - they verified the
      SOURCE path and never questioned the DESTINATION path.
      NEW MAJOR - annotation content_hash is never recomputed
      (annotation_source.py has no reference to it at all), so a tampered
      annotation with a stale hash is accepted, and the annotation artifact
      ID/hash is not bound into parse outputs as D-013 requires. AC-13 broken.
      NEW MAJOR - resolve() runs before the reparse-point walk, so an in-root
      junction whose target stays in-root is accepted, and a runs_root that is
      itself a junction is never checked. C-1 code therefore only
      PARTIALLY_CLOSED and AC-17 still not fully met.
      Further new majors - copied inventory is not rehashed after copying;
      annotation may bind to a style_reference image instead of the floorplan
      because kind is not checked; additional preflight inputs still raise out of
      parse_run(); unsupported DXF findings can be discarded by an earlier
      cardinality failure; the DXF overlay uses a fixed r=20 source-unit radius
      that is unusable for metre-unit DXFs; JPEG EXIF is embedded verbatim into
      the overlay; the overlay is written non-exclusively and can follow a
      staging symlink.
      CONFIRMED CLOSED - C-1 spatial (duplicate openings), code M-2, M-3, M-4,
      M-5, M-7, spatial M-3, M-5.
      CANNOT_VERIFY - code M-8 and M-9: the two test files that would prove them
      were not included in the review package. An orchestrator packaging gap, not
      an implementation defect.
    deferral_rejected: >-
      The reviewer accepted the 2.5-degree / 0.1-percent arithmetic for a 0.9 m
      opening but rejected the general conclusion. For a 0.05 m opening the same
      0.04 m perpendicular budget gives a projected span of 0.03 m - a 66.7
      percent excess - and a 0.04 m perpendicular span centred on the wall
      projects to zero while still passing both endpoint checks. The reviewer
      also constructed a 0.9 m case where raw-versus-projected width flips
      PARSE_OPENING_WIDTH_EXCEEDS_WALL. Because width feeds canonical geometry
      and stable IDs, the reviewer judges this a PLAN-002 section 20 retained
      Geometry/Contract gate requiring Moshe's explicit approval, not an
      implementer decision.
    evidence: evidence/PLAN-002/reviews/independent-openai-rework-review-20260810.md

