    deferred_items:
      - id: M-2b-spatial
        summary: >-
          Derive opening width_m from the span projected onto the matched wall
          direction rather than the raw span length.
        status: DEFERRED_WITH_REASONING
        rationale: >-
          The collinearity gate delivered in M-2a now requires both span
          endpoints within OPENING_OFFSET_M (0.02 m) of the wall's infinite
