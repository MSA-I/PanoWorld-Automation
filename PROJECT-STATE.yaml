moshe_domain_rules:
  # Domain knowledge stated by Moshe. Captured verbatim in meaning so it is not
  # lost, even where it cannot be applied yet.
  - id: DR-001
    stated_at: "2026-08-10"
    rule: >-
      Interior wall thickness is always 10 cm. Exterior door depth follows the
      thickness of the exterior wall it sits in - i.e. a door's depth equals the
      thickness of its host wall, and interior walls are a fixed 10 cm.
    applies_to: wall_thickness_and_door_depth
    status: RECORDED_NOT_YET_APPLICABLE
    why_not_yet: >-
      PLAN-002 Part 1 deliberately excludes wall thickness. Section 3 forbids a
      wall-thickness default outright, section 6 states thickness stays absent
      unless a future approved contract represents it, and section 19 assigns it
      to PLAN-003. The parse contract carries wall centrelines only, with no
      thickness field, so this rule cannot be implemented without a contract
      change and a new approved PLAN.
    consume_in: >-
      PLAN-003 geometry compilation, where centrelines are extruded into a white
      model and thickness first becomes real. Carry DR-001 into that PLAN's
      inputs rather than rediscovering it.
  - id: M-12
    summary: >-
      The approved post-approval spatial brief
      (evidence/PLAN-002/design/post-approval-spatial-brief-2026-08-09.md) was
      rewritten in place during implementation (906 insertions, 309 deletions)
      instead of being amended as an append-only record.
    decision: ACCEPTED_AS_IS
    decided_by: Moshe
    decided_at: "2026-08-10"
    rationale: >-
      Moshe reviewed the finding and directed that the current brief content be
      retained rather than reverted to the 2026-08-09 version. The original text
      remains recoverable from git history on branch
      panoworld-dev/t_b7ade39e-p1-02-floorplan-parsing, so the record is not
      lost. No rework action is required for this finding.

