  - name: plan-002-independent-spatial-reviewer
    role: Independent Spatial/Geometry Reviewer for PLAN-002 implementation
    plan_id: PLAN-002
    provider: anthropic
    requested_model: "Opus 5"
    actual_model_id: "claude-opus-5"
    normalized_effort: HIGH
    provider_effort: session-inherited
    fallback: "no"
    model_reason: "MODEL-ROUTING-v1 rule 3 - spatial authority for coordinate transforms, identity rules, invariants and overlay alignment"
    reviewer_model: "Moshe human approval"
    cross_provider_review: "yes"
    status: DONE
    verdict: "NEEDS_REWORK; 1 critical, 4 major, 4 minor, 4 info"
    key_findings: >-
      C-1 duplicate-geometry detection covers walls and rooms but not openings
      (validate.py:181-188 has no seen_openings set), so two coincident doors
      produce two identical entity ids, zero findings, status complete, CLI 0 and
      G1 eligibility - violates section 7 identity rules and AC-8; confirmed by
      the orchestrator by direct code inspection. M-2 opening-to-wall matching
      tests only the opening centre point, not the section 6 requirement that the
      opening line be collinear with exactly one wall, so a perpendicular or 45
      degree door binds silently with up to 41 percent width error. M-3 the
      proper-crossing test folds zero into the negative branch, so collinear
      overlaps and vertex-on-edge touches are never detected - AC-9 NOT MET.
      M-4 the DXF overlay source layer is built from the detections' own
      provenance, so source and detections are coincident by construction and
      cannot disagree - AC-14 unfalsifiable for DXF, and rooms/doors groups are
      emitted empty. M-5 JPEG sources are embedded as data:image/png.
    verified_correct: >-
      Challenged and held: y-down to y-up transform matches the specified
      formula exactly with 0.0 round-trip error; quantization uses
      Decimal(str(v)) before hashing with correct banker's rounding and -0.0
      normalization; anchor is the minimum over wall endpoints only; CCW sign,
      canonical rotation and idempotence correct; IDs stable across 20 random
      reorderings and across in-bounds additions; opening half-width fit checked
      at both wall ends; confidence comparison strictly less-than 0.5; overlays
      XML-valid, LF-only, timestamp-free, no script or external content.
    ac6_strength_assessment: >-
      The shared-generator suspicion was tested and is FALSE - the fixture tool
      holds two independently transcribed coordinate tables (mm/y-up and
      px/y-down) with no shared constant, and the reviewer reproduced the
      canonical hash from both. But AC-6 is narrower than the acceptance file
      implies: every fixture coordinate is axis-aligned and an exact multiple of
      0.05 m so no rounding path is exercised, the translation anchor makes
      height_px invisible to the projection, the opening comparison cannot see
      the collinearity defect, and both adapters share normalize() end-to-end so
      they can only ever be wrong together.
    ac_verdicts: >-
      VERIFIED AC-6, AC-7, AC-11, AC-16 (with caveat);
      WEAK_EVIDENCE AC-10;
      NOT_MET AC-8, AC-9, AC-14
    evidence: evidence/PLAN-002/reviews/independent-anthropic-spatial-review-20260810.md

