          0.9 m door and caps raw-versus-projected length drift near 0.1
          percent - too small to flip any pass/fail invariant. Width is computed
          in dxf_worker.py before wall matching occurs, so projecting it would
          require relocating the computation after resolution, which exceeds a
          bounded rework pass. Recorded for a future PLAN rather than silently
          dropped.
