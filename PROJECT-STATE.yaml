current_plan:
  id: PLAN-002-floorplan-parsing
  title: Floorplan parsing
  status: THIRD_REWORK_DONE_PENDING_CROSS_PROVIDER_REVIEW
  open_gate_conditions:
    - id: GC-1
      text: "Validate and contain parse_run_id before any filesystem operation."
      kind: bounded_code_fix
    - id: GC-2
      text: >-
        Rework path checking so lexical reparse points, including runs_root
        itself, are not erased by resolve() before inspection.
      kind: bounded_code_fix
    - id: GC-3
      text: >-
        Apply reparse and containment checks to source-manifest and
        quality-artifact paths before reading them.
      kind: bounded_code_fix
    - id: GC-4
      text: >-
        Recompute the annotation content_hash and bind its artifact ID and hash
        into parse outputs.
      kind: bounded_code_fix
    - id: GC-5
      text: >-
        Restrict annotation image binding to approved floorplan or PDF-page
        source artifacts, rejecting missing, ambiguous, cross-run or unsupported
        bindings.
      kind: bounded_code_fix
    - id: GC-6
      text: >-
        Resolve opening-fit semantics by using projected width after successful
        wall resolution, or by adopting an explicit projection-ratio and
        minimum-span invariant.
      kind: retained_human_gate
      gate: "PLAN-002 section 20 Geometry/Contract - requires Moshe's explicit approval before implementation"
      decision: PROJECTED_WIDTH
      decided_by: Moshe
      decided_at: "2026-08-10"
      decision_detail: >-
        Option B. width_m is the length of the opening span projected onto the
        direction of the matched wall, computed after wall resolution succeeds.
        The raw drawn span length is not used. Rationale accepted: an opening
        sits inside its wall, so the real gap in the wall is exactly the
        projection; a crooked drawn line is annotation imprecision, not
        building geometry, and using the raw length reports an opening wider
        than the one that physically exists.
      first_asked_wrong: >-
        The orchestrator's first question used the Hebrew word for "width"
        ambiguously and Moshe answered about wall thickness and door depth
        instead - captured separately as DR-001. The question was re-asked with
        a diagram distinguishing opening width along the wall from wall
        thickness across it, and this decision is the answer to the re-asked
        question.
      implementation_status: IMPLEMENTED
      clause_approved_at: "2026-08-10"
      implemented_note: >-
        PLAN-002 amended to revision 2 with Moshe's explicit approval of the
        changed section 6 wording, then implemented. width_m is now computed in
        normalize.py after wall resolution by projecting the span onto the
        matched wall's unit direction. A degenerate zero/negative projected
        width fails through the existing PARSE_RESOURCE_LIMIT code - no new
        error code was invented, so contracts/error_codes.md stays append-only.
        Golden canonical projection hash
        sha256:e5041ddcf05eb02da0a07176d483ee4eaef311bf885204078710f07fe3b7e77e
        is UNCHANGED, as predicted, because every Layer A opening is drawn
        parallel to its wall. Verified by the orchestrator against the evidence
        file rather than taken on report.
    - id: GC-7
      text: >-
        Decide how the raster overlay handles source metadata. The OpenAI review
        found that source bytes are embedded verbatim, so a JPEG's EXIF -
        including GPS coordinates and an author name - is copied into
        parse/overlay.svg, which PLAN-002 section 12 forbids. The two candidate
        remedies are to reject metadata-bearing raster input outright, or to
        embed a deterministic sanitised representation while separately binding
        the original bytes by SHA-256.
      kind: retained_human_gate
      gate: >-
        Changes the section 10 overlay contract, so it needs Moshe's decision
        rather than an implementer's. Directly relevant to
        samples/Sample_Floorplan.jpg, which carries 7 EXIF tags.
      decision: SANITISE_AND_EMBED
      decided_by: Moshe
      decided_at: "2026-08-10"
      decision_detail: >-
        Option B. The overlay embeds only the decoded pixel data, stripped of
        EXIF and every other metadata block, while the SHA-256 of the original
        verified source bytes stays bound in overlay metadata so the audit chain
        to the immutable input is unbroken. Metadata-bearing rasters are not
        rejected. Rationale accepted: rejection would block almost every real
        photograph or scan, including the downloaded sample, and would push
        manual cleanup onto the user for no benefit.
      implementation_status: IMPLEMENTED
      clause_approved_at: "2026-08-10"
      implemented_note: >-
        PLAN-002 amended to revision 2 with Moshe's explicit approval of the
        changed section 10 wording, then implemented. _source_binding() now
        re-encodes the decoded image through Pillow with pinned encoder settings
        and forwards no exif/pnginfo/icc_profile, so no metadata block survives.
        No dependency was added - Pillow was already in the locked set.
        Orchestrator verification used the real downloaded
        samples/Sample_Floorplan.jpg: 7 EXIF tags before, 0 after; the literals
        "Exif", "Adobe" and "Photoshop" all absent from the sanitised bytes;
        pixel dimensions preserved; two runs byte-identical; and the original
        file hash differs from the sanitised hash, confirming the binding is to
        the original bytes rather than the copy.
      residual_property: >-
        JPEG sanitisation is a second lossy encode (quality pinned at 95), so
        the embedded image is not bit-identical to the source - the real sample
        went from 235,297 to 171,352 bytes. PNG sanitisation is lossless and the
        implementer covered it with a pixel-perfect round-trip test. This is
        acceptable for an overlay whose purpose is human visual review, and the
        SHA-256 binding still ties it to the exact original bytes, but it is a
        genuine property change and is recorded rather than left implicit.
      followup_minor: >-
        tests/unit/test_floorplan_builder.py uses PIL Image.getdata(), which
        Pillow deprecates for removal in Pillow 14 (2027-10-15). Not urgent and
        not a correctness issue; switch to get_flattened_data() when convenient.
  # Round-3 gate conditions, raised by the NA-3 OpenAI review of the second
  # rework. GC-1..GC-7 above are the round-2 list and are settled; these are new.
  # Numbering is GC3-n so the two lists cannot be confused in a dispatch brief.
  open_gate_conditions_round3:
    - id: GC3-1
      text: >-
        Close the arbitrary-write escape: prove destination containment for the
        whole ancestor chain, not just the run id. A junction at
        runs_root/.staging is currently never inspected, so parse_run() creates
        directories and copies source inventory outside runs_root.
      kind: bounded_code_fix
      severity: CRITICAL
      orchestrator_verified: >-
        REPRODUCED with a proof-of-concept against the real parse_run(): five
        files, including copies of the caller's floorplan and style images,
        written outside runs_root and left there on the failure path. See
        evidence/PLAN-002/reviews/orchestrator-verification-na3-20260810.md.
    - id: GC3-2
      text: >-
        Fix the inventory copy root. copy_source_inventory() joins the
        manifest-declared path (which already begins with "project/") under
        staging_run/"project", so every input lands at project/project/... while
        the derived manifest still declares project/..., and add a
        post-finalization check that every declared path exists with a matching
        SHA-256.
      kind: bounded_code_fix
      severity: MAJOR
      orchestrator_verified: >-
        REPRODUCED by running the existing complete-run integration test with a
        retained basetemp: both declared inventory paths resolve to nothing in a
        run that reports complete and cli_exit 0.
    - id: GC3-3
      text: >-
        Parse, copy, sanitise and hash from one immutable snapshot per input.
        The annotation and the DXF are each read once at preflight and then read
        again for parsing, and the raster's pixels and hash come from two
        separate reads of the same path, so a file swapped in between can be
        parsed under a lineage that binds the earlier bytes.
      kind: bounded_code_fix
      severity: MAJOR
      orchestrator_verified: "no - reviewer-asserted, re-verify during rework"
    - id: GC3-4
      text: >-
        Enforce source-run finality and identity: require a direct, finalized
        child of runs_root (not something under .staging), require the manifest
        and quality report to belong to the same project/run, require exactly
        one kind=floorplan input, and require unique inventory paths.
      kind: bounded_code_fix
      severity: MAJOR
      orchestrator_verified: "no - reviewer-asserted, re-verify during rework"
    - id: GC3-5
      text: >-
        Enforce MAX_DXF_ENTITIES cumulatively across modelspace and every other
        layout, mapping the overflow to PARSE_RESOURCE_LIMIT. Today the cap is
        applied to modelspace only, so entities in paperspace are unbounded.
      kind: bounded_code_fix
      severity: MAJOR
      orchestrator_verified: >-
        CONFIRMED by inspection (dxf_worker.py:143-147 caps len(modelspace) only;
        the layout loop at :169-182 applies no cumulative bound).
    - id: GC3-6
      text: >-
        Remove free-text DXF layout/layer names from artifacts and evidence
        (opaque or redacted source refs), per PLAN-002 section 12.
      kind: bounded_code_fix
      severity: MAJOR
      orchestrator_verified: "no - reviewer-asserted, re-verify during rework"
    - id: GC3-7
      text: >-
        Ensure every preflight/staging filesystem failure returns from
        parse_run() as a CLI-2 result rather than raising. sha256_file(),
        source_floorplan.stat() and staging_run.mkdir() can still raise OSError
        out of the function; cli.main()'s broad guard masks it from the CLI but
        the parse_run() API contract is still broken.
      kind: bounded_code_fix
      severity: MINOR
      orchestrator_verified: "no - reviewer-asserted, re-verify during rework"
    - id: GC3-8
      text: >-
        Decide the contract for selected intake-generated PDF pages. PLAN-002
        section 6 permits annotating one explicitly selected PDF page, but
        intake tags every rendered page with the generic kind "other" and the
        GC-5 fix allowlists only kind "floorplan", so that permitted capability
        is currently unreachable. Either give PDF-page derivatives a distinct
        kind/role or define a provenance-based allowlist.
      kind: retained_human_gate
      gate: "changes PLAN-002 section 6 - Moshe's decision, not an implementer's"
      severity: MAJOR
      orchestrator_verified: "no - reviewer-asserted, re-verify before deciding"
      decision: CONTRACT_CHANGE
      decided_by: Moshe
      decided_at: "2026-08-10"
      decision_detail: >-
        Moshe's answer was that this is a change - i.e. take the contract-change
        route (a distinct kind/role for intake-generated PDF-page derivatives)
        rather than bolting a provenance-based allowlist onto the current
        vocabulary. The narrowing introduced by the GC-5 fix therefore stands as
        correct for now, and the permitted section 6 capability is restored
        through an approved contract amendment instead.
      implementation_status: NOT_IMPLEMENTED
      what_is_still_open: >-
        The decision fixes the ROUTE, not the wording. PLAN-002 section 20 still
        requires Moshe's explicit approval of the exact amended text before any
        implementation: the new kind/role token, whether it lands in the
        project_manifest schema vocabulary or only in intake's tagging, whether
        the schema bump is additive (ADR-0005 requires additive-only), and how a
        single page is "explicitly selected". Do not implement from this entry
        alone - draft the amendment, get it approved, then implement.
      recorded_by_session: PLAN-002-NA3-CROSS-PROVIDER-RE-REVIEW
    - id: GC3-9
      text: >-
        Decide how to remove the absolute paths and OS user name that are
        already committed in tracked evidence without breaking the append-only
        evidence policy - rewrite history, redact in place with a recorded
        amendment, or accept and document.
      kind: retained_human_gate
      gate: "PLAN-002 section 12 versus append-only evidence policy - Moshe's call"
      severity: MAJOR
      orchestrator_verified: >-
        CONFIRMED and broader than reported: 53 occurrences across 29 evidence
        files, mostly legacy PLAN-000/PLAN-001 coverage.xml and command.log.
      decision: ACCEPT_AND_DOCUMENT
      decided_by: Moshe
      decided_at: "2026-08-10"
      decision_detail: >-
        Accept the existing leak and document it. History is NOT rewritten and
        the already-committed files are NOT redacted in place: the append-only
        evidence policy wins over retroactive cleanup, and the exposure is a
        local Windows path and the OS account name "art1" in build/test
        artifacts, not credentials or third-party personal data. This closes the
        finding as a recorded accepted deviation rather than as a defect.
      scope_of_the_accepted_deviation: >-
        53 occurrences across 29 tracked files under evidence/, predominantly
        PLAN-000 and PLAN-001 coverage.xml and command.log artifacts, plus three
        PLAN-002 review/report files. Verified by the orchestrator on 2026-08-10.
      forward_rule: >-
        The acceptance is retrospective only. New evidence must still comply with
        PLAN-002 section 12 - redact absolute paths and the OS user name before
        committing. The GC3-6 code fix (opaque/redacted DXF source refs) is
        unaffected and remains a required bounded fix, because that one leaks
        into runtime ARTIFACTS, not just into historical evidence.
      note_on_public_visibility: >-
        VERIFIED 2026-08-10 AFTER the decision was taken: the GitHub remote
        github.com/MSA-I/PanoWorld-Automation is PUBLIC. The accepted deviation
        is therefore public exposure of the OS account name "art1" and local
        absolute Windows paths, not a local-only artifact. Moshe decided
        "accept and document" knowing the scope (53 occurrences, 29 files) but
        the public visibility was confirmed only afterwards and was reported to
        him. If he wants to revisit, the options are unchanged: history rewrite
        or in-place redaction, both of which now also require a force-push.
      recorded_by_session: PLAN-002-NA3-CROSS-PROVIDER-RE-REVIEW
    - id: GC3-10
      text: >-
        After the above, regenerate the Layer A artifacts and overlays and take
        them through the section 20 visual/geometry gate. This is NA-4 and is
        unchanged; it is restated here because the reviewer listed it as a gate
        condition.
      kind: retained_human_gate
      gate: "PLAN-002 section 20 - Moshe's visual approval"
      severity: N/A
      orchestrator_verified: "n/a"
    - id: GC3-11
      text: >-
        Regression introduced by the NA-3b rework itself, found by the
        orchestrator, not by any reviewer. GC3-7's narrowing of
        `except Exception` to
        `except (OSError, ValueError, UnicodeDecodeError, JSONDecodeError)`
        stopped catching PIL.Image.DecompressionBombError, which derives directly
        from Exception. It is raised by Image.open() above roughly 178 Mpixels,
        and both raster opens (AnnotationSource.extract and _source_binding) run
        BEFORE render_overlay()'s MAX_SOURCE_PIXELS check, so the pixel cap
        cannot fire first. The exception therefore escaped parse_run() - the
        exact API-contract break GC3-7 exists to prevent, reintroduced through a
        different exception class.
      kind: bounded_code_fix
      severity: MAJOR
      orchestrator_verified: >-
        REPRODUCED with a proof-of-concept against the real parse_run() (real
        annotation source, Image.MAX_IMAGE_PIXELS lowered so a small fixture hits
        the production condition): before the rework cli_exit 2, after the rework
        the exception escaped, after the follow-up fix cli_exit 2 again. See
        evidence/PLAN-002/reviews/orchestrator-verification-na3b-20260810.md.
      implementation_status: IMPLEMENTED
      implemented_note: >-
        Dispatched back to the same OpenAI implementer as a bounded follow-up
        rather than fixed by the orchestrator, because PLAN-002 section 17 keeps
        the implementer OpenAI. Both Pillow size-guard classes are now named, and
        the audit it was asked for also added input-driven RecursionError and
        integer-string-conversion ValueError handling for JSON decoding plus a
        decoded-top-level-must-be-an-object check. Four parametrised regression
        tests, 8 cases. No bare `except Exception` was reintroduced and
        test_programming_error_is_not_hidden_as_operational_cli2 still passes, so
        RuntimeError/TypeError/AttributeError still propagate.
  round3_bounded_fix_resolution:
    implemented_at: "2026-08-10"
    implemented_by: plan-002-rework3-implementer
    branch: panoworld-dev/na-3b-gc3-fixes
    dispatch_brief: evidence/PLAN-002/reviews/na3b-rework3-dispatch-20260810.md
    implementer_report: evidence/PLAN-002/reviews/rework3-report-20260810.md
    orchestrator_verification: evidence/PLAN-002/reviews/orchestrator-verification-na3b-20260810.md
    suite: "338 passed, exit 0 (baseline 316; 330 after round 1, 338 after the GC3-11 follow-up)"
    golden_projection_hash: "unchanged - sha256:e5041ddcf05eb02da0a07176d483ee4eaef311bf885204078710f07fe3b7e77e"
    per_gate_verification:
      GC3-1: "CLOSED - orchestrator PoC: pre-fix 5 files written outside runs_root through a .staging junction and left there; after, 0 files outside, cli_exit 2, nothing created"
      GC3-2: "CLOSED - orchestrator PoC: pre-fix all three declared inventory paths absent from a run reporting complete; after, all three present with matching SHA-256"
      GC3-3: "CLOSED by inspection plus 3 implementer tests that fail pre-fix; not separately reproduced (needs an interleaving harness)"
      GC3-4: "CLOSED by inspection plus 5 implementer tests that fail pre-fix"
      GC3-5: "CLOSED - orchestrator PoC at the worker's own entry point: pre-fix 50 entities scanned against a cap of 20 with no error; after, fatal_error_code PARSE_RESOURCE_LIMIT"
      GC3-6: "CLOSED - orchestrator PoC: pre-fix a private layer name appeared in parse-report.json, floorplan_parse.json AND overlay.svg; after, 0 occurrences, opaque tokens only"
      GC3-7: "CLOSED - orchestrator PoC with .staging occupied by a regular file: pre-fix FileExistsError escaped parse_run(); after, cli_exit 2. Both implementer tests for this one pass pre-fix too, so the evidence is the PoC and the diff, not those tests"
    non_vacuity: "13 of the 15 tests added in round 1 fail against a reconstructed pre-fix tree; the 2 that pass are both GC3-7's and are called out above"
    disclosures_for_the_reviewer:
      - >-
        The pre-staging inventory hash check was REMOVED and its test replaced
        (was ..._fails_preflight_without_staging, now ..._fails_snapshot_before_parsing).
        A source-inventory hash mismatch is still CLI 2 with no final run and the
        hash is still verified before any parsing, so Moshe's approved section 20
        semantics hold - but staging is now created and partially populated before
        the mismatch is detected. The orchestrator judges this required rather
        than optional, because the removed check was a second read of the same
        file and that is exactly the TOCTOU GC3-3 exists to eliminate. Flagged
        because a test rewritten to match new behaviour can be a correction or a
        weakening, and that call belongs to the independent reviewer.
      - >-
        The f-hostile-label failure-matrix row no longer asserts that
        "&lt;script&gt;" appears in the overlay; it now asserts the hostile name
        is absent and an opaque token is present. Stronger privacy property, but
        it retires the one test that exercised XML escaping. Escaping itself is
        untouched in overlay.py.
      - >-
        The GC3-5 implementer test reaches its CLI-3 assertion through an
        in-process DxfSource.extract substitute, so the cumulative trigger and
        the subprocess fatal_error_code mapping are proven separately rather than
        in one end-to-end run. The orchestrator PoC covers the worker half.
      - >-
        Three zero-byte junk files were created in the repository root by broken
