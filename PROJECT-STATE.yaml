current_plan:
  id: PLAN-002-floorplan-parsing
  title: Floorplan parsing
  status: REWORK_REVIEWED_NEEDS_SECOND_REWORK
  open_gate_conditions:
    - id: GC-1
      text: "Validate and contain parse_run_id before any filesystem operation."
      kind: bounded_code_fix
    - id: GC-2
      text: >-
        Rework path checking so lexical reparse points, including runs_root
        itself, are not erased by resolve() before inspection.
      kind: bounded_code_fix
    - id: GC-3
      text: >-
        Apply reparse and containment checks to source-manifest and
        quality-artifact paths before reading them.
      kind: bounded_code_fix
    - id: GC-4
      text: >-
        Recompute the annotation content_hash and bind its artifact ID and hash
        into parse outputs.
      kind: bounded_code_fix
    - id: GC-5
      text: >-
        Restrict annotation image binding to approved floorplan or PDF-page
        source artifacts, rejecting missing, ambiguous, cross-run or unsupported
        bindings.
      kind: bounded_code_fix
    - id: GC-6
      text: >-
        Resolve opening-fit semantics by using projected width after successful
        wall resolution, or by adopting an explicit projection-ratio and
        minimum-span invariant.
      kind: retained_human_gate
      gate: "PLAN-002 section 20 Geometry/Contract - requires Moshe's explicit approval before implementation"
    - id: GC-7
      text: >-
        Decide how the raster overlay handles source metadata. The OpenAI review
        found that source bytes are embedded verbatim, so a JPEG's EXIF -
        including GPS coordinates and an author name - is copied into
        parse/overlay.svg, which PLAN-002 section 12 forbids. The two candidate
        remedies are to reject metadata-bearing raster input outright, or to
        embed a deterministic sanitised representation while separately binding
        the original bytes by SHA-256.
      kind: retained_human_gate
      gate: >-
        Changes the section 10 overlay contract, so it needs Moshe's decision
        rather than an implementer's. Directly relevant to
        samples/Sample_Floorplan.jpg, which carries 7 EXIF tags.
  status_note: >-
    Implementation exists as uncommitted working-tree state in the worktree and
    is not merged. Orchestrator re-verified it deterministically on 2026-08-10:
    261 tests pass with inherited PYTHONPATH cleared, git diff --check clean,
    pyproject.toml and uv.lock unchanged. Both Anthropic Opus 5 independent
    reviews returned NEEDS_REWORK with two separate CRITICAL findings, each
    independently confirmed by the orchestrator (containment bypass in
    runs.py:11-31 reproduced with a proof-of-concept; missing opening
    duplicate-detection in validate.py:181-188 confirmed by inspection). The
    passing suite is therefore not sufficient evidence of correctness: the tests
    do not cover these paths. Eight acceptance criteria are NOT MET (AC-8, AC-9,
    AC-12, AC-14, AC-15, AC-17) or WEAK (AC-1, AC-3, AC-10, AC-13, AC-18,
    AC-20). Rework is required before any G1 claim. Fail-closed human gates
    remain outstanding: Moshe's visual/geometry approval of the first Layer A
    overlay (PLAN-002 section 20) and no merge without separate authorisation.
  owner: spatial-architect
  path: docs/plans/PLAN-002-floorplan-parsing.md
  branch: panoworld-dev/t_b7ade39e-p1-02-floorplan-parsing
  worktree: .worktrees/t_b7ade39e

